openapi: 3.2.0
info:
  title: OpenStack Compute (Nova) Flavors API
  description: Nova is the OpenStack Compute service that manages the lifecycle of compute instances (virtual machines, bare-metal, containers) in an OpenStack cloud. The Nova API exposes endpoints for servers, flavors, images, key pairs, security groups, attached volumes, and server actions such as start, stop, reboot, resize, rebuild, and snapshot.
  version: '2.1'
  contact:
    name: OpenStack Nova
    url: https://docs.openstack.org/nova/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://{nova-host}/compute/v2.1
  description: Nova Compute API endpoint (deployment specific)
  variables:
    nova-host:
      default: compute.example.com
security:
- TokenAuth: []
tags:
- name: Flavors
  description: Compute instance flavors.
paths:
  /flavors:
    get:
      operationId: listFlavors
      summary: List flavors
      tags:
      - Flavors
      responses:
        '200':
          description: List of flavors.
  /flavors/detail:
    get:
      operationId: listFlavorsDetail
      summary: List flavors (detailed)
      tags:
      - Flavors
      responses:
        '200':
          description: Detailed list of flavors.
  /flavors/{flavor_id}:
    parameters:
    - name: flavor_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getFlavor
      summary: Get flavor
      tags:
      - Flavors
      responses:
        '200':
          description: Flavor detail.
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
externalDocs:
  description: Nova Compute API reference
  url: https://docs.openstack.org/api-ref/compute/
