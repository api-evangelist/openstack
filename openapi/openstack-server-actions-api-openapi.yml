openapi: 3.2.0
info:
  title: OpenStack Compute (Nova) Server Actions API
  description: Nova is the OpenStack Compute service that manages the lifecycle of compute instances (virtual machines, bare-metal, containers) in an OpenStack cloud. The Nova API exposes endpoints for servers, flavors, images, key pairs, security groups, attached volumes, and server actions such as start, stop, reboot, resize, rebuild, and snapshot.
  version: '2.1'
  contact:
    name: OpenStack Nova
    url: https://docs.openstack.org/nova/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://{nova-host}/compute/v2.1
  description: Nova Compute API endpoint (deployment specific)
  variables:
    nova-host:
      default: compute.example.com
security:
- TokenAuth: []
tags:
- name: Server Actions
  description: Lifecycle actions on servers.
paths:
  /servers/{server_id}/action:
    parameters:
    - name: server_id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: serverAction
      summary: Perform an action on a server
      description: Body is a single-key object naming the action - e.g. os-start, os-stop, reboot, resize, rebuild, createImage, confirmResize, revertResize, pause, unpause, suspend, resume, lock, unlock, rescue, unrescue, shelve, unshelve, migrate, evacuate.
      tags:
      - Server Actions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Action accepted.
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
externalDocs:
  description: Nova Compute API reference
  url: https://docs.openstack.org/api-ref/compute/
