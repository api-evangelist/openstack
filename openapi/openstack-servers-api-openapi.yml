openapi: 3.2.0
info:
  title: OpenStack Compute (Nova) Servers API
  description: Nova is the OpenStack Compute service that manages the lifecycle of compute instances (virtual machines, bare-metal, containers) in an OpenStack cloud. The Nova API exposes endpoints for servers, flavors, images, key pairs, security groups, attached volumes, and server actions such as start, stop, reboot, resize, rebuild, and snapshot.
  version: '2.1'
  contact:
    name: OpenStack Nova
    url: https://docs.openstack.org/nova/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://{nova-host}/compute/v2.1
  description: Nova Compute API endpoint (deployment specific)
  variables:
    nova-host:
      default: compute.example.com
security:
- TokenAuth: []
tags:
- name: Servers
  description: Compute instance management.
paths:
  /servers:
    get:
      operationId: listServers
      summary: List servers
      tags:
      - Servers
      responses:
        '200':
          description: List of servers (summaries).
    post:
      operationId: createServer
      summary: Create server
      tags:
      - Servers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '202':
          description: Server creation accepted.
  /servers/detail:
    get:
      operationId: listServersDetail
      summary: List servers (detailed)
      tags:
      - Servers
      responses:
        '200':
          description: Detailed list of servers.
  /servers/{server_id}:
    parameters:
    - name: server_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getServer
      summary: Get server
      tags:
      - Servers
      responses:
        '200':
          description: Server detail.
    put:
      operationId: updateServer
      summary: Update server
      tags:
      - Servers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Server updated.
    delete:
      operationId: deleteServer
      summary: Delete server
      tags:
      - Servers
      responses:
        '204':
          description: Server deleted.
components:
  schemas:
    CreateServerRequest:
      type: object
      required:
      - server
      properties:
        server:
          type: object
          required:
          - name
          - flavorRef
          properties:
            name:
              type: string
            imageRef:
              type: string
            flavorRef:
              type: string
            networks:
              type: array
              items:
                type: object
                properties:
                  uuid:
                    type: string
                  port:
                    type: string
            block_device_mapping_v2:
              type: array
              items:
                type: object
            security_groups:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
            key_name:
              type: string
            user_data:
              type: string
            metadata:
              type: object
              additionalProperties:
                type: string
            availability_zone:
              type: string
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
externalDocs:
  description: Nova Compute API reference
  url: https://docs.openstack.org/api-ref/compute/
