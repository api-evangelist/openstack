openapi: 3.2.0
info:
  title: OpenStack Compute (Nova) Keypairs API
  description: Nova is the OpenStack Compute service that manages the lifecycle of compute instances (virtual machines, bare-metal, containers) in an OpenStack cloud. The Nova API exposes endpoints for servers, flavors, images, key pairs, security groups, attached volumes, and server actions such as start, stop, reboot, resize, rebuild, and snapshot.
  version: '2.1'
  contact:
    name: OpenStack Nova
    url: https://docs.openstack.org/nova/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://{nova-host}/compute/v2.1
  description: Nova Compute API endpoint (deployment specific)
  variables:
    nova-host:
      default: compute.example.com
security:
- TokenAuth: []
tags:
- name: Keypairs
  description: SSH key pair management.
paths:
  /os-keypairs:
    get:
      operationId: listKeypairs
      summary: List key pairs
      tags:
      - Keypairs
      responses:
        '200':
          description: List of key pairs.
    post:
      operationId: createKeypair
      summary: Create or import key pair
      tags:
      - Keypairs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keypair:
                  type: object
                  properties:
                    name:
                      type: string
                    public_key:
                      type: string
                    type:
                      type: string
                      enum:
                      - ssh
                      - x509
      responses:
        '200':
          description: Key pair created.
  /os-keypairs/{name}:
    parameters:
    - name: name
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getKeypair
      summary: Get key pair
      tags:
      - Keypairs
      responses:
        '200':
          description: Key pair detail.
    delete:
      operationId: deleteKeypair
      summary: Delete key pair
      tags:
      - Keypairs
      responses:
        '202':
          description: Key pair deletion accepted.
components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
externalDocs:
  description: Nova Compute API reference
  url: https://docs.openstack.org/api-ref/compute/
