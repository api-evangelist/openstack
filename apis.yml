aid: openstack
name: OpenStack
description: >-
  Open source cloud computing platform for building and managing public and private clouds, providing infrastructure as
  a service (IaaS) through a set of interrelated services including Compute (Nova), Object Storage (Swift), Block
  Storage (Cinder), Networking (Neutron), Identity (Keystone), Image (Glance), Orchestration (Heat), Database (Trove),
  DNS (Designate), and Load Balancer (Octavia). Each service exposes its own REST API; clients authenticate against
  Keystone and use the returned service catalog to discover per-region endpoints for the remaining services.
type: Index
accessModel:
  pricing: free
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Free · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
position: Consumer
access: 3rd-Party
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/openstack.png
tags:
  - Cloud Platform
  - Infrastructure as a Service
  - Open Source
  - Virtualization
  - Linux Foundation
